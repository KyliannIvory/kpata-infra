services:
  nginx: 
    image: nginx:1.31-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    networks:
     - kpata_network
    
  frontend:
    build: ../kpata-frontend
    environment:
      - API_URL=http://backend:8080
    networks:
      - kpata_network

networks:
  kpata_network:
    external: true


